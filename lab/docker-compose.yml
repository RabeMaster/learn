# 저장소 전체가 함께 쓰는 실습 환경입니다.
#
# 모든 서비스에 profiles가 걸려 있어서 그냥 up 하면 아무것도 뜨지 않습니다.
# 필요한 것만 골라서 띄웁니다.
#
#   docker compose --profile db up -d      PostgreSQL + MySQL
#   docker compose --profile pg up -d      PostgreSQL만
#   docker compose --profile redis up -d   Redis만
#
# 테이블은 여기서 만들지 않습니다. 글마다 필요한 게 다르므로
# 각 주제 폴더의 sql/<글 폴더>/00_setup.sql 을 직접 실행해서 만듭니다.
services:
  postgres:
    image: postgres:16
    container_name: lab-pg
    profiles: ["db", "pg"]
    environment:
      POSTGRES_USER: ravenid
      POSTGRES_PASSWORD: ravenpw
      POSTGRES_DB: labdb
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      # 저장소 전체를 읽기 전용으로 넣어둡니다.
      # 이러면 셸 리다이렉션(<) 없이 -f 나 \i 로 SQL을 실행할 수 있어서
      # 윈도우 PowerShell에서도 명령이 그대로 통합니다.
      - ../:/repo:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravenid -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    profiles: ["db", "mysql"]
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ravenpw
      MYSQL_DATABASE: labdb
      MYSQL_USER: ravenid
      MYSQL_PASSWORD: ravenpw
      TZ: Asia/Seoul
      # mysql 클라이언트는 접속할 때 OS 로케일을 보고 문자셋을 정합니다.
      # 이 이미지(Oracle Linux)는 LANG이 비어 있어서 POSIX로 떨어지고,
      # 그러면 클라이언트가 latin1로 붙어 한글이 입력되지 않습니다.
      # C.utf8을 넣어 두면 utf8mb4로 붙습니다.
      LANG: C.utf8
    ports:
      - "3306:3306"
    volumes:
      - ../:/repo:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uravenid -pravenpw --silent"]
      interval: 5s
      timeout: 15s
      retries: 20

  redis:
    image: redis:7
    container_name: lab-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
